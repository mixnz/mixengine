<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7.75 -7.75 79.5 79.5" width="64" height="64" role="img" aria-labelledby="mixlab-logo-title">
  <title id="mixlab-logo-title">MixLab</title>
  <!-- The macOS copy of logo.svg: the same drawing, on a canvas with a margin.

       macOS lays its app icons on a 1024pt grid where the rounded square fills 824 of it, and it
       does not mask third-party icons to match, so an edge-to-edge tile sits visibly larger than
       every neighbour in the Dock. The tile here is 64 units on a canvas of 79.5, which is that
       824/1024 ratio. The margin lives in the viewBox alone: every coordinate below is still in
       the tile's own 0-64 space and is byte for byte the same as in logo.svg.

       Only icon.icns is built from this file. Edit logo.svg, then copy the drawing here and keep
       this viewBox — scripts/make-icons.mjs refuses to run if the two files drift apart. -->
  <defs>
    <linearGradient id="mixlab-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2361CE"/>
      <stop offset="1" stop-color="#12307A"/>
    </linearGradient>
    <radialGradient id="mixlab-glow" cx=".22" cy=".08" r=".95">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mixlab-stroke" x1=".2" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#EAF4FF"/>
      <stop offset=".45" stop-color="#7FC4FF"/>
      <stop offset="1" stop-color="#35CDEB"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#mixlab-tile)"/>
  <rect width="64" height="64" rx="15" fill="url(#mixlab-glow)"/>
  <g fill="none" stroke="url(#mixlab-stroke)" stroke-linecap="round" stroke-linejoin="round">
    <!-- The ring, from 80 degrees clockwise the long way round to 15: a 65-degree gap centred on
         the lower-right diagonal, which is where the L leaves. -->
    <path d="M35.3 50.71A19 19 0 1 1 50.35 36.92" stroke-width="6.5"/>
    <!-- M and L, the L's foot crossing the ring's line through the gap. -->
    <path d="M20.5 41.5V25.5l6 7 6-7v16" stroke-width="5.5"/>
    <path d="M39.5 25.5v16h15" stroke-width="5.5"/>
  </g>
</svg>
