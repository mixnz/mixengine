<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="mixlab-logo-title">
  <title id="mixlab-logo-title">MixLab</title>
  <!-- MixLab's mark: a ring open at the lower right, with an ML ligature inside it whose L runs
       out through the opening — a window onto the machine rather than another box around it.

       Stroked in the brand's light-surface gradient read from the top of the ring down to the
       opening, over the deep blue tile. Brand blue is #2D86E0 and the gradient it anchors runs
       #1A57C4 -> #2D86E0 -> #35CDEB.

       One cut, not two. The design asks for a heavier small-size cut because a thin ring does not
       survive a 16px favicon; the weights here — 6.5 units of 64 for the ring, 5.5 for the
       letters — are chosen so this one cut holds at that size, and the second cut waits for the
       owner's own SVGs. See the T104 design, D3.

       Drawn as an app tile rather than a bare mark. A shape on a transparent ground has no
       presence in a taskbar or a dock, so it needs a ground of its own to sit on.

       The tile fills the canvas edge to edge, which is what Windows, Linux and the favicon expect.
       macOS reserves a margin around its icons instead; that copy is logo-macos.svg next to this
       file, identical except for its viewBox. Keep the two in step — scripts/make-icons.mjs
       refuses to run if they drift apart. -->
  <defs>
    <linearGradient id="mixlab-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2361CE"/>
      <stop offset="1" stop-color="#12307A"/>
    </linearGradient>
    <radialGradient id="mixlab-glow" cx=".22" cy=".08" r=".95">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mixlab-stroke" x1=".2" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#EAF4FF"/>
      <stop offset=".45" stop-color="#7FC4FF"/>
      <stop offset="1" stop-color="#35CDEB"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#mixlab-tile)"/>
  <rect width="64" height="64" rx="15" fill="url(#mixlab-glow)"/>
  <g fill="none" stroke="url(#mixlab-stroke)" stroke-linecap="round" stroke-linejoin="round">
    <!-- The ring, from 80 degrees clockwise the long way round to 15: a 65-degree gap centred on
         the lower-right diagonal, which is where the L leaves. -->
    <path d="M35.3 50.71A19 19 0 1 1 50.35 36.92" stroke-width="6.5"/>
    <!-- M and L, the L's foot crossing the ring's line through the gap. -->
    <path d="M20.5 41.5V25.5l6 7 6-7v16" stroke-width="5.5"/>
    <path d="M39.5 25.5v16h15" stroke-width="5.5"/>
  </g>
</svg>
