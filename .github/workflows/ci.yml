# CI: every job is described in docs/operations/build-and-release.md, and why each one is
# shaped as it is in that page's "Why CI is shaped this way".
name: CI

# Only a `v*` tag fires a run. Every branch, `master` included, is pushed and then requested:
# `gh workflow run ci.yml --ref <branch>`. More in "Why CI is shaped this way", docs/operations/build-and-release.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      # One group at a time, and `all` by default, so narrowing is chosen rather than inherited. A
      # group is a job's own name.
      jobs:
        description: "Which jobs to run. `all` is every one of them."
        type: choice
        default: all
        options: [all, lint, test, system, bench, bindings, docs, desktop, build]

# A second request on the same ref makes the previous run pointless. A feature branch's run is
# cancelled and replaced, because asking again means the answer in flight is about a commit you have
# already moved past, and waiting it out delays the one you now want. Runs on `master` are kept
# anyway, so that ref keeps a complete result history however the runs were started.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A tag joins master in never being cancelled (T86). A cancelled release run leaves a half-uploaded
  # draft, which is the one state that pipeline has no answer for.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI builds are never incremental: it only costs cache size and hurts a cold runner.
  CARGO_INCREMENTAL: 0
  # T170l: line tables only in debug builds. Set here rather than per job because rust-cache
  # hashes the `CARGO_*` environment into its key.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  lint:
    # **`inputs` is empty for a tag push**, which is what the first arm is for: a release
    # runs every job whatever a dispatch might once have narrowed.
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'lint' }}
    name: lint
    runs-on: ubuntu-latest
    # Generous, but far short of the six-hour default: a job that hangs should free the runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # T169, ADR 0043. Every link into the documentation resolves, every spec's status header is
      # valid and agrees with the roadmap, and docs/specs/README.md is what the script generates.
      # First because it needs no toolchain: ubuntu-latest ships Node.
      - name: Documentation links and spec status
        run: |
          node --test scripts/check-docs.test.mjs
          node scripts/check-docs.mjs

      # No toolchain action: rust-toolchain.toml is the single source of truth for the version and
      # for the clippy/rustfmt components. Given no argument, `rustup toolchain install` installs
      # exactly what that file pins — note that `rustup show` stopped installing anything in 1.28.
      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
          # See the note on `test`'s cache (T170a).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # T40, D8: the helper runs as root, so its dependency tree is a security decision. A change
      # here means reading the diff and committing the updated list in the same change.
      - name: The elevated helper builds without the rest of the platform
        run: cargo check -p mixengine-elevate --locked

      - name: The elevated helper's dependency budget
        run: |
          set -euo pipefail
          cargo tree -p mixengine-elevate --no-default-features --edges normal             --prefix none --format '{p}' | sed 's/ v[0-9].*//' | sort -u > /tmp/elevate-dependencies.txt
          grep -v '^#' .github/elevate-dependencies.txt | diff -u - /tmp/elevate-dependencies.txt

      # ADR 0013: `linux/secrets.rs` works only while the tree holds one `dbus-secret-service`.
      # `--color never` is load-bearing: coloured `(*)` markers break the count.
      - name: One dbus-secret-service in the tree, or the Linux keyring reading is silently dead
        run: |
          set -euo pipefail
          found=$(cargo tree --workspace --locked --color never --target x86_64-unknown-linux-gnu             --prefix none --format '{p}' | sed 's/ (\*)$//'             | grep '^dbus-secret-service ' | sort -u)
          echo "$found"
          test "$(printf '%s\n' "$found" | grep -c .)" -eq 1

      # T14: `--check` fails when a query changed without `cargo sqlx prepare`. Prebuilt, and pinned
      # to Cargo.lock's sqlx, because `.sqlx/` is a version-specific format.
      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.9.0

      - name: sqlx offline data is current
        env:
          DATABASE_URL: sqlite:target/sqlx-ci.db
        run: |
          cargo sqlx database create
          cargo sqlx migrate run --source crates/mixengine-core/migrations
          cargo sqlx prepare --workspace --check -- --all-targets --all-features

      # rustdoc runs in the `test` job instead, once per runner — see the note there. It has to be
      # built on the OS it documents, and this job only has one.
      #
      # Licences and advisories. Configuration lives in deny.toml, including the six release targets.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # `check` alone would also run `sources`, which is fine, but being explicit means a new
          # check category added upstream cannot silently start failing our builds.
          arguments: --all-features
          command-arguments: advisories bans licenses sources

      # T86, D9: `packaging/sign.sh` would otherwise only ever run in a release, so it runs here,
      # against a throwaway key.
      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign

      - name: The signing script signs everything, and refuses a key that is not the product's
        run: bash .github/scripts/test-sign.sh

      # T88. The other half of what a release depends on and no ordinary run exercises: the document
      # every installed copy reads to find out that a newer one exists. Same reasoning as the step
      # above — the only other thing that would ever run `feed.sh` is a release.
      - name: The feed describes the archives beside it
        run: bash .github/scripts/test-feed.sh

      # T105a: `AppRun`'s refusal below the window's floor, against a fixture directory with stubbed
      # binaries. Nothing else would run it but somebody downloading a release.
      - name: The AppImage's AppRun fills its cache and refuses in the right words
        run: bash packaging/linux/apprun-check.sh

  test:
    # **`inputs` is empty for a tag push**, which is what the first arm is for: a release
    # runs every job whatever a dispatch might once have narrowed.
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'test' }}
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 45 is where waiting stops being the answer, not a budget (phase 11).
    timeout-minutes: 45
    strategy:
      # One OS failing must not hide the result on the other two — the platform layer is exactly
      # where per-OS divergence shows up.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/leg-budget
        with:
          phase: start

      # T2b: this leg holds an enabled `BUILTIN\Administrators` (a full token). Kept as an assertion
      # because docs/standards/testing.md derives a rule from it.
      - name: What this leg runs as (T2b)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $groups = whoami /groups
          $groups
          $admin = $groups | Select-String -SimpleMatch 'S-1-5-32-544'
          if (-not ($admin -and "$admin" -match 'Enabled group')) {
            Write-Host '::error::This leg is no longer an elevated administrator, which is good news and not a build failure. Re-read the Privilege section of docs/standards/testing.md, which concluded the opposite, and delete this step with it.'
            exit 1
          }

      # T170k: the image turns Defender's real-time protection off; this records that it still does.
      # It warns and never fails: a scanner makes a leg slower, not wrong.
      - name: Defender's state
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            $status = Get-MpComputerStatus -ErrorAction Stop
            $status | Select-Object AMRunningMode, AntivirusEnabled, RealTimeProtectionEnabled | Format-List
            'Exclusions: ' + ((Get-MpPreference -ErrorAction Stop).ExclusionPath -join ', ')
            if ($status.RealTimeProtectionEnabled) {
              Write-Host '::warning title=Defender is scanning::Real-time protection is on in this runner image, so every file this leg writes is scanned. Expect it to be slower than usual.'
            }
          } catch {
            Write-Host "Defender's state could not be read on this runner: $_"
          }

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          # T170a: only `master` writes the cache; branches and tags restore its entry. A run requested
          # on `master` after a merge is what refreshes it.
          save-if: ${{ github.ref == 'refs/heads/master' }}
          # Saved by a `master` leg that failed or was cut off too — the action's default saves only
          # from a green job, which is how a cold cache and a timeout feed each other: the first cold
          # leg is cut off, saves nothing, and the rerun is cold again (run 34235885258). A cache is a
          # record of what compiled, and a red test says nothing about that.
          cache-on-failure: true

      # T170a: a leg that restored nothing says so. A cold build is the first explanation for a slow
      # leg, and it belongs in the run summary rather than in a log line nobody reads. The action's
      # `cache-hit` output cannot say it: it is true only for an exact key match, and a branch whose
      # `Cargo.lock` changed restores a partial one.
      - name: Say whether the cache was cold
        shell: bash
        run: |
          if [ -n "$(ls -A target/debug/deps 2>/dev/null)" ]; then
            echo "Restored a build cache."
          else
            echo "::warning title=Cold cache::This leg restored no build cache and compiles from scratch. On a branch that means master has no entry for this key yet; request a run on master."
          fi

      # Everything the build needs is downloaded here, while the network is still allowed. From this
      # point on cargo runs offline, so a dependency that is not in Cargo.lock fails the job instead
      # of being fetched silently.
      - name: Fetch dependencies
        run: cargo fetch --locked

      # The runner for the workspace step (T170f). Pinned, and installed while the network is still
      # there: on Linux the suite runs in a namespace with no route out.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145

      - name: Build tests
        run: cargo test --workspace --all-targets --all-features --locked --offline --no-run

      # A D-Bus secret service so the keyring tests run rather than skip (T15b), and `libnss3-tools`
      # for `certutil` (T49b). A job step because the suite runs with no route out; bounded, because
      # a stalled mirror once cost a whole run.
      - name: Install the packages this leg's tests need
        if: runner.os == 'Linux'
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && break
            echo "::warning title=apt-get update failed::attempt $attempt of 3"
            sleep 5
          done

          sudo apt-get install -y --no-install-recommends gnome-keyring dbus libnss3-tools

      # Linux is the leg that actually proves "no network in tests": the suite runs in a namespace
      # with nothing but loopback. The script runs the doc tests too, inside the same namespace. The
      # real-program suites are the `services` job's, through the same script (T170e).
      - name: Test (no network)
        if: runner.os == 'Linux'
        env:
          CARGO_NET_OFFLINE: "true"
        run: bash .github/scripts/test-no-network.sh workspace

      # T15b: takes the store away in three ways and asserts the answer. Outside the network
      # namespace, because the script builds the D-Bus it needs.
      - name: Test the answer a machine with no secret service gets
        if: runner.os == 'Linux'
        run: bash .github/scripts/test-absent-secret-service.sh

      # T49b: `#[ignore]`d, and run only on this leg, the one that has `libnss3-tools`.
      - name: Test against a real certutil
        if: runner.os == 'Linux'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test browsers --locked --offline -- --ignored

      # Windows and macOS rely on the harness (T11) and offline cargo for isolation. Under
      # cargo-nextest (T170f, `.config/nextest.toml`); plain `cargo test` stays the contract.
      - name: Test
        if: runner.os != 'Linux'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo nextest run --workspace --all-targets --all-features --locked --offline --profile ci

      # `--all-targets` silently excludes doc tests; run them separately so rustdoc examples cannot
      # rot. The Linux runner did this inside the namespace already.
      - name: Doc tests
        if: runner.os != 'Linux'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --locked --offline --doc

      # The only tool that resolves intra-doc links, once per OS because each OS directory of
      # `mixengine-platform` builds only on its own OS. Windows runs it as `rustdoc` (T170d).
      - name: rustdoc
        if: (success() || failure()) && runner.os != 'Windows'
        env:
          RUSTDOCFLAGS: -D warnings
          CARGO_NET_OFFLINE: "true"
        run: >
          cargo doc --workspace --no-deps --document-private-items --all-features --locked
          --offline

      - uses: ./.github/actions/leg-budget
        if: always()
        with:
          phase: end
          target-minutes: "15"
          ceiling-minutes: "45"

  # **rustdoc for Windows (T170d)**, split out of the Windows `test` leg, which is the run's critical
  # path; macOS and Linux still run it as the last step of `test`. What it checks, and why once per
  # operating system, is the comment on that step.
  rustdoc:
    # `jobs: test` answers "is test green yet", and after T170 that answer takes `test`, `services`
    # and this job together, so the one option runs all three.
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'test' }}
    name: rustdoc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Measured at 2.5 minutes cold as a step of `test` (run 35430523430).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows only: the `rustdoc` step of `test` covers the other two (T170d).
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/leg-budget
        with:
          phase: start

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: rustdoc
          # See the note on `test`'s cache (T170a).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
          CARGO_NET_OFFLINE: "true"
        run: >
          cargo doc --workspace --no-deps --document-private-items --all-features --locked
          --offline

      - uses: ./.github/actions/leg-budget
        if: always()
        with:
          phase: end
          target-minutes: "15"
          ceiling-minutes: "45"

  # T170e: the suites that need a real program, one matrix group per leg. A new suite joins a
  # group, and a leg past 15 minutes warm becomes a new row.
  services:
    # `jobs: test` answers "is test green yet", and after T170 that answer takes `test`, this job and
    # `rustdoc` together, so the one option runs all three.
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'test' }}
    name: services (${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    # The suites carry clocks of their own; this is the ceiling every job in this file shares.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Caddy, nginx, PHP, the caches and MongoDB.
          - { os: windows-latest, group: web }
          # The SQL servers: MariaDB twice, PostgreSQL, MySQL.
          - { os: windows-latest, group: sql }
          - { os: macos-latest, group: all }
          # Inside the network namespace, as they ran in `test`.
          - { os: ubuntu-latest, group: all }
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/leg-budget
        with:
          phase: start

      # T2b: this leg holds an enabled `BUILTIN\Administrators` (a full token). Kept as an assertion
      # because docs/standards/testing.md derives a rule from it.
      - name: What this leg runs as (T2b)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $groups = whoami /groups
          $groups
          $admin = $groups | Select-String -SimpleMatch 'S-1-5-32-544'
          if (-not ($admin -and "$admin" -match 'Enabled group')) {
            Write-Host '::error::This leg is no longer an elevated administrator, which is good news and not a build failure. Re-read the Privilege section of docs/standards/testing.md, which concluded the opposite, and delete this step with it.'
            exit 1
          }

      # T170k: the image turns Defender's real-time protection off; this records that it still does.
      # It warns and never fails: a scanner makes a leg slower, not wrong.
      - name: Defender's state
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            $status = Get-MpComputerStatus -ErrorAction Stop
            $status | Select-Object AMRunningMode, AntivirusEnabled, RealTimeProtectionEnabled | Format-List
            'Exclusions: ' + ((Get-MpPreference -ErrorAction Stop).ExclusionPath -join ', ')
            if ($status.RealTimeProtectionEnabled) {
              Write-Host '::warning title=Defender is scanning::Real-time protection is on in this runner image, so every file this leg writes is scanned. Expect it to be slower than usual.'
            }
          } catch {
            Write-Host "Defender's state could not be read on this runner: $_"
          }

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          # `test`'s own entry: the same profile and features, and this job only reads it. See the
          # note on `test`'s cache (T170a).
          shared-key: test
          key: test
          save-if: false

      # T170a: a leg that restored nothing says so. A cold build is the first explanation for a slow
      # leg, and it belongs in the run summary rather than in a log line nobody reads. The action's
      # `cache-hit` output cannot say it: it is true only for an exact key match, and a branch whose
      # `Cargo.lock` changed restores a partial one.
      - name: Say whether the cache was cold
        shell: bash
        run: |
          if [ -n "$(ls -A target/debug/deps 2>/dev/null)" ]; then
            echo "Restored a build cache."
          else
            echo "::warning title=Cold cache::This leg restored no build cache and compiles from scratch. On a branch that means master has no entry for this key yet; request a run on master."
          fi

      - name: Fetch dependencies
        run: cargo fetch --locked

      # T31: the one test that judges a recipe against the program it configures. From our own
      # index, pinned: a fixture, not an install. Before the offline steps.
      - name: Fetch a real Caddy
        if: contains(fromJSON('["web","all"]'), matrix.group)
        shell: bash
        run: bash .github/scripts/fetch-package.sh --probe "caddy version" caddy 2.11.4 MIXENGINE_CADDY_PACKAGE

      # T37: how an nginx `include` resolves is nginx's own question. The whole tree, because the
      # generated `nginx.conf` includes the archive's `conf/mime.types` by absolute path.
      - name: Fetch a real nginx
        if: contains(fromJSON('["web","all"]'), matrix.group)
        shell: bash
        # `-v` and not `-t`: the second reads a configuration, and there is none here. It is also
        # what the recipe's smoke test runs, so a build that fails this fails an install too.
        run: bash .github/scripts/fetch-package.sh --absent-on Windows-ARM64 --probe "nginx -v" nginx 1.31.3 MIXENGINE_NGINX_PACKAGE

      # T32: `php-fpm` on Unix, `php-cgi` on Windows. Only the program tells a recipe that renders
      # from one that runs.
      - name: Fetch a real PHP
        if: contains(fromJSON('["web","all"]'), matrix.group)
        shell: bash
        # `bin/php` on Unix, `php.exe` at the root on Windows — the layout is the publisher's, and
        # the suite probes for it rather than writing it down. This is only the smoke check.
        run: bash .github/scripts/fetch-package.sh --probe "bin/php --version" --probe "php --version" php 8.3.33 MIXENGINE_PHP_RUNTIME

      # PHP 7.0 is the only one that can falsify an `extension =` name: 7.2 and later append the
      # suffix themselves, which once hid five missing modules.
      - name: Fetch the oldest PHP the module names have to satisfy
        if: contains(fromJSON('["web","all"]'), matrix.group)
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/fetch-package.sh php 7.0.33 MIXENGINE_PHP_70 "$RUNNER_TEMP/php-70"

          if [ "$RUNNER_OS" = "Windows" ]; then separator=';'; else separator=':'; fi
          echo "MIXENGINE_PHP_RUNTIMES=$RUNNER_TEMP/php-70$separator$RUNNER_TEMP/php" >> "$GITHUB_ENV"

      # T33: the first recipe that creates something before it can run.
      - name: Fetch a real MariaDB
        if: contains(fromJSON('["sql","all"]'), matrix.group)
        shell: bash
        run: bash .github/scripts/fetch-package.sh --probe "bin/mariadbd --version" mariadb 11.4.12 MIXENGINE_MARIADB_PACKAGE

      # T36: two instances at two versions; 10.6 and 11.4 differ in program names and `share/`.
      - name: Fetch a second MariaDB, of an older series
        if: contains(fromJSON('["sql","all"]'), matrix.group)
        shell: bash
        # This series ships `bin/mysqld` and a `bin/mariadbd` beside it; the suite probes for
        # every program it needs and this is only the smoke check.
        run: bash .github/scripts/fetch-package.sh --probe "bin/mariadbd --version" mariadb 10.6.28 MIXENGINE_MARIADB_LEGACY_PACKAGE "$RUNNER_TEMP/mariadb-legacy"

      # T34c: MySQL 8.4. The 5.x lines are smoke-tested by mixengine-packages.
      - name: Fetch a real MySQL
        if: contains(fromJSON('["sql","all"]'), matrix.group)
        shell: bash
        # Neither mixengine-packages nor upstream publishes MySQL for Windows on ARM.
        run: bash .github/scripts/fetch-package.sh --absent-on Windows-ARM64 --probe "bin/mysqld --version" mysql 8.4.10 MIXENGINE_MYSQL_PACKAGE

      # And a real PostgreSQL, for T34 — the recipe that made T34a necessary. It is the smaller of
      # the two databases, and it is the one whose Windows leg only runs at all because a supervised
      # child is now created from a restricted token: `postgres` refuses the full token the step at
      # the top of this job asserts this runner holds.
      - name: Fetch a real PostgreSQL
        if: contains(fromJSON('["sql","all"]'), matrix.group)
        shell: bash
        # Upstream does not compile PostgreSQL for Windows on ARM before 19, so the index offers
        # nothing on that cell and the suite is skipped rather than failed.
        run: bash .github/scripts/fetch-package.sh --absent-on Windows-ARM64 --probe "bin/postgres --version" postgres 18.6 MIXENGINE_POSTGRES_PACKAGE

      # And the two caches, for T35. Small downloads next to the two databases above, and the pair
      # of them is one roadmap task because neither is big enough to be one on its own.
      - name: Fetch a real Redis
        if: contains(fromJSON('["web","all"]'), matrix.group)
        shell: bash
        # Cygwin has no aarch64 port, so the Windows cells of both caches are built for x86_64
        # and that one alone — see mixengine-packages' `docs/packages/redis-memcached.md`.
        run: bash .github/scripts/fetch-package.sh --absent-on Windows-ARM64 --probe "bin/redis-server --version" redis 8.10.0 MIXENGINE_REDIS_PACKAGE

      - name: Fetch a real memcached
        if: contains(fromJSON('["web","all"]'), matrix.group)
        shell: bash
        # `-V` and not `--version`: the short flag is in every line the index publishes.
        run: bash .github/scripts/fetch-package.sh --absent-on Windows-ARM64 --probe "bin/memcached -V" memcached 1.6.45 MIXENGINE_MEMCACHED_PACKAGE

      # And MongoDB, for T156. The newest line: 8.x needs macOS 14 and glibc 2.34, and every leg of
      # this job is newer than both.
      - name: Fetch a real MongoDB
        if: contains(fromJSON('["web","all"]'), matrix.group)
        shell: bash
        # Upstream has never built MongoDB for Windows on ARM, at any version.
        run: bash .github/scripts/fetch-package.sh --absent-on Windows-ARM64 --probe "bin/mongod --version" mongodb 8.3.11 MIXENGINE_MONGODB_PACKAGE

      # `--bins` is not optional: the harness needs `mixengined` and `mixengine-shim` beside `mix`,
      # and `--test` builds only its own package's binaries.
      - name: Build the suites this leg runs
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          case "${{ matrix.group }}" in
            web) suites="connections caddy sharing nginx routes php_fpm php_extensions php_modules redis memcached mongodb" ;;
            sql) suites="mariadb instances postgres mysql" ;;
            all) suites="connections caddy sharing nginx routes php_fpm php_extensions php_modules redis memcached mongodb mariadb instances postgres mysql" ;;
          esac
          args=()
          for suite in $suites; do args+=(--test "$suite"); done
          cargo build --workspace --bins --all-features --locked --offline
          cargo test --workspace --all-features --locked --offline --no-run "${args[@]}"

      # The credential store the SQL suites' first-run rituals need, for the reason `test`'s step of
      # the same name gives. Bounded the same way.
      - name: Install the packages this leg's tests need
        if: runner.os == 'Linux'
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && break
            echo "::warning title=apt-get update failed::attempt $attempt of 3"
            sleep 5
          done

          sudo apt-get install -y --no-install-recommends gnome-keyring dbus

      # Linux runs every suite below from inside the network namespace, with a credential store of
      # its own — see the script. The steps after this one are the other two systems'.
      - name: Test the suites (no network)
        if: runner.os == 'Linux'
        env:
          CARGO_NET_OFFLINE: "true"
        run: bash .github/scripts/test-no-network.sh services

      # T69: the connection count against a socket that is really established, on all three
      # systems. No privilege needed, so not `system`. Outside the namespace on Linux.
      # `--workspace --all-features` on every suite, never `-p` (T170b): `-p` recompiles.
      - name: Test against a real connection
        if: contains(fromJSON('["web","all"]'), matrix.group)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test connections --locked --offline -- --ignored --nocapture

      # The suite that needs the archive above. `#[ignore]`d rather than skipped, so a system where
      # it does not run says so instead of reporting a pass — see the note at the top of
      # `crates/mixengine-cli/tests/caddy.rs`. The Linux runner did this inside the namespace
      # already; a Caddy on loopback does not need a route out.
      - name: Test against a real Caddy
        if: runner.os != 'Linux' && contains(fromJSON('["web","all"]'), matrix.group)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test caddy --locked --offline -- --ignored

      # T76: what a shared site listens on, against the real Caddy. The firewall half is
      # `mixengine-core --test firewall`. Not on Linux, which runs its front ends in a namespace.
      - name: Test what a shared site listens on
        if: runner.os != 'Linux' && contains(fromJSON('["web","all"]'), matrix.group)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test sharing --locked --offline -- --ignored

      # T37: the same assertions as Caddy's, from `tests/harness/frontend.rs`: a parity suite.
      - name: Test against a real nginx
        if: runner.os != 'Linux' && env.MIXENGINE_NGINX_PACKAGE != '' && contains(fromJSON('["web","all"]'), matrix.group)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test nginx --locked --offline -- --ignored

      # **One site, many backends, through both front ends** — roadmap task T135. Two steps for one
      # suite, on the rule every pair here follows: a failure should name which server disagreed
      # without anybody reading the log. The suite drives a proxy route, a rewriting proxy route and
      # a files route; it needs no PHP, which is why it sits above the PHP steps rather than among
      # them.
      - name: Test one site's routes against a real Caddy
        if: runner.os != 'Linux' && contains(fromJSON('["web","all"]'), matrix.group)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test routes --locked --offline -- --ignored caddy_

      # The same guard the nginx step above carries, for its reason: there is no nginx to fetch on
      # Windows-on-ARM and no upstream that publishes one.
      - name: Test one site's routes against a real nginx
        if: runner.os != 'Linux' && env.MIXENGINE_NGINX_PACKAGE != '' && contains(fromJSON('["web","all"]'), matrix.group)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test routes --locked --offline -- --ignored nginx_

      # And the one that needs the PHP. Its own step rather than a second `--test` on the line above,
      # because a failure should name which recipe failed without anybody reading the log.
      - name: Test against a real PHP
        if: runner.os != 'Linux' && contains(fromJSON('["web","all"]'), matrix.group)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test php_fpm --locked --offline -- --ignored

      # And the ini set that PHP reads — T28. Its own step for the reason the one above has: a
      # failure should name which half failed without anybody reading the log.
      - name: Test the generated PHP ini set
        if: runner.os != 'Linux' && contains(fromJSON('["web","all"]'), matrix.group)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test php_extensions --locked --offline -- --ignored

      # And the module names against *both* branches — the suite above proves the set reaches PHP,
      # this one proves the names in it name files that exist. Its own step for the same reason: a
      # failure should say which of the two questions went unanswered.
      - name: Test the module names against every branch
        if: runner.os != 'Linux' && contains(fromJSON('["web","all"]'), matrix.group)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test php_modules --locked --offline -- --ignored

      # Linux runs this inside `test-no-network.sh`, which provides a credential store.
      # `--nocapture` and a timeout of its own: libtest holds a test's output until it ends.
      - name: Test against a real MariaDB
        if: runner.os != 'Linux' && contains(fromJSON('["sql","all"]'), matrix.group)
        timeout-minutes: 15
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test mariadb --locked --offline -- --ignored --nocapture

      # T36: the expensive half, two servers at once. Linux runs it inside `test-no-network.sh`.
      - name: Test two instances of one server, at two versions
        if: runner.os != 'Linux' && contains(fromJSON('["sql","all"]'), matrix.group)
        timeout-minutes: 25
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test instances --locked --offline -- --ignored --nocapture

      # T34. Linux runs it inside `test-no-network.sh`; on Windows it relies on T34a's restricted
      # token (ADR 0010).
      - name: Test against a real PostgreSQL
        if: runner.os != 'Linux' && env.MIXENGINE_POSTGRES_PACKAGE != '' && contains(fromJSON('["sql","all"]'), matrix.group)
        timeout-minutes: 15
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test postgres --locked --offline -- --ignored --nocapture

      # T34c. Linux runs it inside `test-no-network.sh`; it skips where no MySQL was fetched.
      - name: Test against a real MySQL
        if: runner.os != 'Linux' && env.MIXENGINE_MYSQL_PACKAGE != '' && contains(fromJSON('["sql","all"]'), matrix.group)
        timeout-minutes: 15
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test mysql --locked --offline -- --ignored --nocapture

      # And the two caches — T35. Two steps rather than one for the reason the PHP pair are two: a
      # failure should name which recipe failed without anybody reading the log.
      - name: Test against a real Redis
        if: runner.os != 'Linux' && env.MIXENGINE_REDIS_PACKAGE != '' && contains(fromJSON('["web","all"]'), matrix.group)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test redis --locked --offline -- --ignored --nocapture

      - name: Test against a real memcached
        if: runner.os != 'Linux' && env.MIXENGINE_MEMCACHED_PACKAGE != '' && contains(fromJSON('["web","all"]'), matrix.group)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test memcached --locked --offline -- --ignored --nocapture

      # And MongoDB — T156. Spoken to over the wire by the suite itself, so nothing else is needed.
      - name: Test against a real MongoDB
        if: runner.os != 'Linux' && env.MIXENGINE_MONGODB_PACKAGE != '' && contains(fromJSON('["web","all"]'), matrix.group)
        timeout-minutes: 15
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --test mongodb --locked --offline -- --ignored --nocapture

      - uses: ./.github/actions/leg-budget
        if: always()
        with:
          phase: end
          target-minutes: "15"
          ceiling-minutes: "45"

  # T40: what only a privileged process can prove. On every run, because a dispatch has no diff
  # to filter on. 45 minutes since the certificate and uninstall suites joined.
  system:
    # **`inputs` is empty for a tag push**, which is what the first arm is for: a release
    # runs every job whatever a dispatch might once have narrowed.
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'system' }}
    name: system (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: system
          # See the note on `test`'s cache (T170a).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Fetch dependencies
        run: cargo fetch --locked

      # Built as the ordinary user and *run* as root below. `sudo cargo test` would compile a second
      # copy of everything into a target directory root owns, and leave it there for the next job.
      - name: Build the system suite
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-elevate --test system --locked --offline --no-run

      # This leg already holds a full administrator token (T2b, asserted in the `test` job), so there
      # is nothing to raise: running the binary directly is running it elevated.
      # `--test-threads=1`: every test in this suite writes the one audit directory this machine has,
      # which is the whole point of it being a system suite. Run in parallel they interleave on that
      # one directory and assert about each other's half-finished work rather than about the code.
      - name: Elevated suite (Windows)
        if: runner.os == 'Windows'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-elevate --test system --locked --offline -- --ignored --nocapture --test-threads=1

      # `sudo -E` keeps SUDO_UID and the cargo environment: the suite hands its request file back to
      # the invoking user, because a root-owned request is exactly what the helper refuses.
      - name: Elevated suite (Unix)
        if: runner.os != 'Windows'
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          suite=$(cargo test -p mixengine-elevate --test system --locked --offline --no-run \
            --message-format=json | jq -r 'select(.profile.test == true) | .executable' | tail -n 1)
          echo "running $suite as root"
          sudo -E "$suite" --ignored --nocapture --test-threads=1

      # T40a's launchers, which are in `mixengine-platform` rather than in the helper: what is under
      # test is the thing that *raises* the prompt. The helper is built explicitly rather than left to
      # the step above, because this suite finds it beside the test binary and a reordering of these
      # steps should not silently turn that into a skip.
      - name: Build the launcher suite
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo build -p mixengine-elevate --locked --offline
          cargo test -p mixengine-platform --test elevation --locked --offline --no-run

      # As the elevated suite above: this leg already holds a full administrator token, so `runas`
      # raises nothing and the round trip runs unattended.
      - name: Launchers (Windows)
        if: runner.os == 'Windows'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-platform --test elevation --locked --offline -- --ignored --nocapture --test-threads=1

      # `timeout-minutes` of its own, rather than the job's 20. The macOS leg is a **measurement**:
      # whether `do shell script … with administrator privileges` authenticates on a process that is
      # already root is not something this project can settle by reading. If it prompts, it hangs, and
      # this is the clock that ends it — see the T40a design, "Testing". The Linux leg needs no token
      # at all and asserts the opposite: that a machine with no authentication agent says so.
      - name: Launchers (Unix)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          suite=$(cargo test -p mixengine-platform --test elevation --locked --offline --no-run \
            --message-format=json | jq -r 'select(.profile.test == true) | .executable' | tail -n 1)
          echo "running $suite as root"
          sudo -E "$suite" --ignored --nocapture --test-threads=1

      # T41's hosts engine, against the machine's own `/etc/hosts`. Its unit tests drive the same
      # `apply` against files they own; what only a real machine can answer is whether the replace
      # keeps the file's owner and its ACL, and whether an ordinary token is refused. The test takes
      # a copy first and asserts the file came back byte for byte, so a runner is left as it was.
      - name: Build the hosts suite
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-platform --test hosts --locked --offline --no-run

      - name: The hosts file (Windows)
        if: runner.os == 'Windows'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-platform --test hosts --locked --offline -- --ignored --nocapture --test-threads=1

      # `--test-threads=1` for the elevated suite's reason: there is one hosts file on this machine.
      - name: The hosts file (Unix)
        if: runner.os != 'Windows'
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          suite=$(cargo test -p mixengine-platform --test hosts --locked --offline --no-run \
            --message-format=json | jq -r 'select(.profile.test == true) | .executable' | tail -n 1)
          echo "running $suite as root"
          sudo -E "$suite" --ignored --nocapture --test-threads=1

      # T42: port access against each machine's own mechanism; the tests restore what they touch.
      # No Windows leg: that system only refuses, which `test` asserts.
      - name: Build the port-access suite
        if: runner.os != 'Windows'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-platform --test port_access --locked --offline --no-run

      # `--test-threads=1` for the hosts suite's reason: there is one `/etc/pf.conf` on this machine
      # and one packet filter, and two tests interleaving on them would assert about each other's
      # half-finished work.
      - name: Port access (Unix)
        if: runner.os != 'Windows'
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          suite=$(cargo test -p mixengine-platform --test port_access --locked --offline --no-run \
            --message-format=json | jq -r 'select(.profile.test == true) | .executable' | tail -n 1)
          echo "running $suite as root"
          sudo -E "$suite" --ignored --nocapture --test-threads=1

      # T45: every test that concludes from a failed name first proves its DNS server answers (D14).
      - name: Build the resolver suite
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-platform --test resolver --locked --offline --no-run

      - name: The resolver (Windows)
        if: runner.os == 'Windows'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-platform --test resolver --locked --offline -- --ignored --nocapture --test-threads=1

      # `--test-threads=1` for the hosts suite's reason: there is one resolver configuration on this
      # machine, and two tests interleaving on it would assert about each other's half-finished work.
      - name: The resolver (Unix)
        if: runner.os != 'Windows'
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          suite=$(cargo test -p mixengine-platform --test resolver --locked --offline --no-run             --message-format=json | jq -r 'select(.profile.test == true) | .executable' | tail -n 1)
          echo "running $suite as root"
          sudo -E "$suite" --ignored --nocapture --test-threads=1

      # T49a, T54: the only tests that touch this machine's trust store, gated on
      # `MIXENGINE_SYSTEM_TESTS=1` as well as `#[ignore]` (docs/standards/testing.md, rule 1).
      - name: Fetch a real Caddy
        if: runner.os != 'Linux'
        shell: bash
        run: bash .github/scripts/fetch-package.sh --probe "caddy version" caddy 2.11.4 MIXENGINE_CADDY_PACKAGE

      # Both suites drive a real `mix` against a real `mixengined`, and a rotation reaches the store
      # through the `mixengine-elevate` beside it — three binaries in one directory, which is what
      # `cargo test --workspace` hands the other jobs and what this one has to ask for. The helper is
      # named here as well as in the launcher step above, for that step's reason: a reordering should
      # not silently turn it into a skip.
      - name: Build the certificate suites
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo build -p mixengine-daemon -p mixengine-elevate --locked --offline
          cargo test -p mixengine-cli --test cert --locked --offline --no-run

      - name: Build the certificate suite that needs a front end
        if: runner.os != 'Linux'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-cli --test caddy --locked --offline --no-run

      # One trust store, so one test at a time. The whole `caddy` suite, because an `--exact` filter
      # on a renamed test passes as `0 tests`.
      - name: The certificate authority this machine ends up trusting (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 12
        env:
          CARGO_NET_OFFLINE: "true"
          MIXENGINE_SYSTEM_TESTS: "1"
        run: |
          cargo test -p mixengine-cli --test cert --locked --offline -- --ignored --nocapture --test-threads=1
          cargo test -p mixengine-cli --test caddy --locked --offline -- --ignored --nocapture --test-threads=1

      # As root, so a rotation is granted and the gated test has something to assert. Its own
      # timeout, because nothing here could answer a prompt.
      - name: The certificate authority this machine ends up trusting (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 12
        env:
          CARGO_NET_OFFLINE: "true"
          MIXENGINE_SYSTEM_TESTS: "1"
        run: |
          set -euo pipefail
          for name in cert caddy; do
            suite=$(cargo test -p mixengine-cli --test "$name" --locked --offline --no-run \
              --message-format=json | jq -r 'select(.profile.test == true) | .executable' | tail -n 1)
            echo "running $suite as root"
            sudo -E "$suite" --ignored --nocapture --test-threads=1
          done

      # `cert`, not `caddy`: with no polkit agent a rotation is never granted (ADR 0005), so what
      # Linux answers is the refusal.
      - name: The certificate authority this machine ends up trusting (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        env:
          CARGO_NET_OFFLINE: "true"
          MIXENGINE_SYSTEM_TESTS: "1"
        run: |
          set -euo pipefail
          suite=$(cargo test -p mixengine-cli --test cert --locked --offline --no-run \
            --message-format=json | jq -r 'select(.profile.test == true) | .executable' | tail -n 1)
          echo "running $suite as root"
          sudo -E "$suite" --ignored --nocapture --test-threads=1

      # T85b: a real logon task and systemd user unit under scratch names, removed afterwards. The
      # Linux leg asserts register-or-refuse-with-a-reason. Ordinary user, one test at a time.
      - name: The daemon's autostart entry
        if: runner.os != 'macOS'
        env:
          CARGO_NET_OFFLINE: "true"
          MIXENGINE_SYSTEM_TESTS: "1"
        run: cargo test -p mixengine-platform --lib --locked --offline autostart -- --ignored --nocapture --test-threads=1

      # What that suite left behind, on the resolver step's shape below and for its reason.
      - name: The autostart entries this job left behind
        if: always() && runner.os != 'macOS'
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) schtasks /Query /FO LIST | grep -i mixengine || echo "no MixEngine task, which is how a runner starts" ;;
            *)       ls -la ~/.config/systemd/user/ 2>/dev/null || echo "no user units, which is how a runner starts" ;;
          esac

      # T87: the clean-VM smoke test. Last of the suites, because it takes the machine apart.
      - name: Build the uninstall suite
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-cli --test uninstall --locked --offline --no-run

      - name: Nothing of ours is left on this machine (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 12
        env:
          CARGO_NET_OFFLINE: "true"
          MIXENGINE_SYSTEM_TESTS: "1"
        run: cargo test -p mixengine-cli --test uninstall --locked --offline -- --ignored --nocapture --test-threads=1

      - name: Nothing of ours is left on this machine (Unix)
        if: runner.os != 'Windows'
        timeout-minutes: 12
        env:
          CARGO_NET_OFFLINE: "true"
          MIXENGINE_SYSTEM_TESTS: "1"
        run: |
          set -euo pipefail
          suite=$(cargo test -p mixengine-cli --test uninstall --locked --offline --no-run \
            --message-format=json | jq -r 'select(.profile.test == true) | .executable' | tail -n 1)
          echo "running $suite as root"
          sudo -E "$suite" --ignored --nocapture --test-threads=1

      # What the resolver suite left behind, so a failure has the evidence beside it — the packet
      # filter step's shape, for its reason. The suite puts the machine back; this is how we find out
      # on the run where it did not.
      - name: The resolver configuration this job left behind
        if: always()
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) reg query "HKLM\SYSTEM\CurrentControlSet\services\Dnscache\Parameters\DnsPolicyConfig" /s || echo "no policy rules, which is how a runner starts" ;;
            macOS)   ls -la /etc/resolver/ 2>/dev/null || echo "no /etc/resolver, which is how a runner starts" ;;
            *)       ls -la /etc/systemd/network/ 2>/dev/null || true ; resolvectl status 2>/dev/null | head -30 || echo "no systemd-resolved here" ;;
          esac

      # What the macOS leg left in the packet filter, so a failure has the evidence beside it. The
      # test puts pf back the way it found it; this is how we find out on the run where it did not.
      - name: The packet filter this job left behind
        if: always() && runner.os == 'macOS'
        run: |
          # `sudo`, because `/dev/pf` belongs to root — which is D9's whole point and the reason the
          # daemon compares three files instead of asking pf. Without it this step printed
          # "pfctl: /dev/pf: Permission denied" and no evidence at all.
          sudo /sbin/pfctl -s info || true
          sudo /sbin/pfctl -s nat || true
          echo "--- /etc/pf.conf ---"
          cat /etc/pf.conf
          ls -l /etc/pf.anchors/ /Library/LaunchDaemons/ | grep -i mixengine || echo "nothing of ours"

      # T49a: whether the certificate is in the keychain and whether it is trusted are two facts.
      - name: The trust store this job left behind
        if: always()
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) certutil -store Root | grep -i -A 2 mixengine || echo "nothing of ours in LocalMachine\Root" ;;
            macOS)
              # Bounded and given no console, for the reason this step exists: a `security` that
              # waits for an answer nobody can give is exactly what the suite ran into, and a
              # diagnostic that inherits the fault it was added to diagnose burns the job's twenty
              # minutes a second time. `alarm` survives `exec`, so the limit lands on `security`.
              bounded() { perl -e 'alarm 30; exec @ARGV' "$@" </dev/null; }
              echo "--- certificates in the System keychain ---"
              bounded security find-certificate -a -c "MixEngine" /Library/Keychains/System.keychain || echo "nothing of ours, or the read did not answer"
              echo "--- admin trust settings ---"
              bounded sudo security dump-trust-settings -d || echo "no admin trust settings, or the read did not answer"
              ;;
            *)
              ls -l /usr/local/share/ca-certificates/ /etc/pki/ca-trust/source/anchors/ 2>/dev/null | grep -i mixengine || echo "nothing of ours in the anchors directories"
              ;;
          esac

      # What the suite left behind, so a failure has the evidence beside it.
      # T85. The privileged helper this job installed, and where. `always()` for the reason every
      # step in this block has it: what an elevated job left on a machine is worth printing whether
      # or not the assertions about it held.
      - name: The privileged helper this job installed
        if: always()
        shell: bash
        run: |
          case "${{ runner.os }}" in
            # `ProgramFiles`, in the runner's own spelling, for the reason the audit log's step
            # below records about `ProgramData`: bash is case-sensitive about a name Windows is not.
            Windows) helper="${ProgramFiles:-C:/Program Files}/MixEngine/mixengine-elevate.exe" ;;
            macOS)   helper="/Library/PrivilegedHelperTools/dev.mixengine.elevate" ;;
            *)       helper="/usr/local/libexec/mixengine/mixengine-elevate" ;;
          esac
          if [ -e "$helper" ]; then ls -l "$helper"; else echo "no helper at $helper"; fi

      # T87: prints what the uninstall suite left; Windows includes its pending-rename queue (D8).
      - name: What the uninstall suite left behind
        if: always()
        shell: bash
        run: bash .github/scripts/system-uninstall-leftovers.sh

      - name: The audit log this job produced
        if: always()
        shell: bash
        run: |
          case "${{ runner.os }}" in
            # `ProgramData`, not `PROGRAMDATA`: Windows itself is case-insensitive about the name,
            # but bash is not, and the runner exports it in this spelling. The first run of this
            # step printed "no log at /MixEngine/elevate.log".
            Windows) log="${ProgramData:-C:/ProgramData}/MixEngine/elevate.log" ;;
            macOS)   log="/Library/Logs/MixEngine/elevate.log" ;;
            *)       log="/var/log/mixengine/elevate.log" ;;
          esac
          if [ -f "$log" ]; then cat "$log"; else echo "no log at $log"; fi

  # T29: the performance budgets, in a release build, on all three systems because the shim's
  # hand-over differs (`exec` on Unix, a Job Object on Windows).
  bench:
    # **`inputs` is empty for a tag push**, which is what the first arm is for: a release
    # runs every job whatever a dispatch might once have narrowed.
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'bench' }}
    name: bench (${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    # Ninety rather than the thirty this job started with: M3 added a release build of the
    # daemon and the client, three archives to fetch, and a suite that starts three real servers
    # eight times; T72a added three PHP archives and a suite that waits out a sweep before it
    # can measure anything; and T73 added one that bootstraps two databases and settles each.
    timeout-minutes: 90
    strategy:
      # A budget missed on one system is not a reason to stop measuring the other two: the numbers
      # are only comparable when they were all taken.
      fail-fast: false
      matrix:
        # **Windows runs as two legs (T170j)**: its measurements alone took 13.5 minutes in run
        # 35430523430, on top of an 11-minute release build. macOS and Linux measure in about 7 and
        # stay one leg. A group is a set of measurements, and each leg builds only what its group
        # needs; the fetches are shared, because Caddy is in both and all of them cost seconds.
        include:
          - { os: windows-latest, group: budgets }
          - { os: windows-latest, group: footprint }
          - { os: macos-latest, group: all }
          - { os: ubuntu-latest, group: all }
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/leg-budget
        with:
          phase: start

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
          # See the note on `test`'s cache (T170a). The two Windows legs share one key, so one of
          # them writes it (T170j).
          save-if: ${{ github.ref == 'refs/heads/master' && matrix.group != 'footprint' }}

      - name: Fetch dependencies
        run: cargo fetch --locked

      # M3's three servers, before the offline steps, pinned to `services`' versions on purpose.
      - name: Fetch the three servers M3 is about
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/fetch-package.sh caddy 2.11.4 MIXENGINE_CADDY_PACKAGE
          bash .github/scripts/fetch-package.sh mariadb 11.4.12 MIXENGINE_MARIADB_PACKAGE
          bash .github/scripts/fetch-package.sh redis 8.10.0 MIXENGINE_REDIS_PACKAGE

      # T72a: three cold pools need three versions. 7.0 and 7.4 predate `pm.status_listen`, which
      # keeps T72a's status-page decision honest.
      - name: Fetch the three PHPs the cold path wakes
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/fetch-package.sh php 7.0.33 MIXENGINE_PHP_70 "$RUNNER_TEMP/php-70"
          bash .github/scripts/fetch-package.sh php 7.4.33 MIXENGINE_PHP_74 "$RUNNER_TEMP/php-74"
          bash .github/scripts/fetch-package.sh php 8.3.33 MIXENGINE_PHP_83 "$RUNNER_TEMP/php-83"

          if [ "$RUNNER_OS" = "Windows" ]; then separator=';'; else separator=':'; fi
          echo "MIXENGINE_PHP_RUNTIMES=$RUNNER_TEMP/php-70$separator$RUNNER_TEMP/php-74$separator$RUNNER_TEMP/php-83" >> "$GITHUB_ENV"

      # The MariaDB bootstrap needs a credential store: Linux installs one, and each measuring step
      # wraps itself in a D-Bus session of its own.
      - name: Install a secret service
        if: runner.os == 'Linux'
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && break
            echo "::warning title=apt-get update failed::attempt $attempt of 3"
            sleep 5
          done

          sudo apt-get install -y --no-install-recommends gnome-keyring dbus

      # `fakeservice` is a dev-dependency's binary: selecting a test target does not rebuild it.
      - name: Build the program the shim is measured against
        if: contains(fromJSON('["budgets","all"]'), matrix.group)
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo build --release -p mixengine-testkit --bin fakeservice --locked --offline

      # And the daemon the M3 suite drives, for the same reason and a different one: `mixengined` is
      # another package, so `cargo test -p mixengine-cli` never builds it — the suite finds it beside
      # the `mix` it was given, which is exactly how a released `mix` finds it at run time.
      - name: Build the daemon M3 measures
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo build --release -p mixengine-daemon --locked --offline

      # `--test-threads=1` is load-bearing rather than tidiness: both tests spend their whole time
      # creating processes, so run in parallel each of them measures the other — 34 ms against 21 ms
      # for the same difference on the same machine. `--nocapture` because the numbers are the
      # output, and a passing test's stdout is otherwise swallowed.
      - name: Performance budgets
        if: contains(fromJSON('["budgets","all"]'), matrix.group)
        env:
          CARGO_NET_OFFLINE: "true"
        run: >
          cargo test --release -p mixengine-shim --test overhead --locked --offline
          -- --ignored --nocapture --test-threads=1

      # The idle footprint. Before M3, which is bimodal on ubuntu, because a failing step ends the
      # job.
      - name: Idle footprint
        if: contains(fromJSON('["footprint","all"]'), matrix.group)
        timeout-minutes: 10
        env:
          CARGO_NET_OFFLINE: "true"
        run: >
          cargo test --release -p mixengine-cli --test idle_footprint --locked --offline
          -- --ignored --nocapture

      # T72a: the cold path. It waits for a sweep, not a clock (T70, D8). Before M3, as above.
      - name: Cold path
        if: contains(fromJSON('["budgets","all"]'), matrix.group)
        timeout-minutes: 15
        env:
          CARGO_NET_OFFLINE: "true"
        run: >
          cargo test --release -p mixengine-cli --test cold_path --locked --offline
          -- --ignored --nocapture

      # T73: gates the difference between tuned and default MariaDB, never either number. Before M3.
      - name: What the tuned defaults save
        if: runner.os != 'Linux' && contains(fromJSON('["footprint","all"]'), matrix.group)
        timeout-minutes: 20
        env:
          CARGO_NET_OFFLINE: "true"
        run: >
          cargo test --release -p mixengine-cli --test tuned_footprint --locked --offline
          -- --ignored --nocapture

      - name: What the tuned defaults save
        if: runner.os == 'Linux' && contains(fromJSON('["footprint","all"]'), matrix.group)
        timeout-minutes: 20
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail

          dbus-run-session -- sh -c \
            'printf "mixengine-ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null || exit 1
             exec cargo test --release -p mixengine-cli --test tuned_footprint --locked --offline -- --ignored --nocapture'

      # M3: caddy, mariadb and redis healthy in under ten seconds warm. `--nocapture` because the
      # numbers are the output.
      - name: M3 — three services, warm
        if: runner.os != 'Linux' && contains(fromJSON('["footprint","all"]'), matrix.group)
        timeout-minutes: 20
        env:
          CARGO_NET_OFFLINE: "true"
        run: >
          cargo test --release -p mixengine-cli --test warm_start --locked --offline
          -- --ignored --nocapture

      - name: M3 — three services, warm
        if: runner.os == 'Linux' && contains(fromJSON('["footprint","all"]'), matrix.group)
        timeout-minutes: 20
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail

          dbus-run-session -- sh -c \
            'printf "mixengine-ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null || exit 1
             exec cargo test --release -p mixengine-cli --test warm_start --locked --offline -- --ignored --nocapture'

      - uses: ./.github/actions/leg-budget
        if: always()
        with:
          phase: end
          target-minutes: "15"
          ceiling-minutes: "45"

  # T56: regenerates the TypeScript contract and fails on drift. Ubuntu alone: generation is
  # OS-independent, and `test` runs the exporter on all three.
  bindings:
    # **`inputs` is empty for a tag push**, which is what the first arm is for: a release
    # runs every job whatever a dispatch might once have narrowed.
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'bindings' }}
    name: bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: bindings
          # See the note on `test`'s cache (T170a).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Fetch dependencies
        run: cargo fetch --locked

      # The gate. It regenerates into a temporary directory and diffs, so a red job is a message and
      # not also a dirty checkout — and so it answers the same way on a machine that unpacked a
      # tarball rather than cloned one.
      - name: The committed contract is what mixengine-proto generates
        run: bash packaging/bindings.sh --check

      # Redundant with `lint`, which passes `--all-features`, and kept: this is the job somebody
      # opens when the contract is the thing that broke, and the crate is already compiled here.
      - name: The contract's own feature is clean
        run: cargo clippy -p mixengine-proto --features ts --all-targets --locked -- -D warnings

      # So the packing path runs on every CI run rather than for the first time during a release —
      # the rule `lint` already applies to `sign.sh` and `feed.sh`, whose only other caller is also
      # a release. The script opens the archive it just made and asserts what is in it.
      - name: The archive a release publishes can be built
        run: bash packaging/bindings.sh --pack

  # T90: builds the handbook's site and holds the command reference against what `mix` prints.
  docs:
    # **`inputs` is empty for a tag push**, which is what the first arm is for: a release
    # runs every job whatever a dispatch might once have narrowed.
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'docs' }}
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
          # See the note on `test`'s cache (T170a).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: The corpus builds a site, and the committed command reference is current
        run: bash packaging/docs.sh --check

  # T103, ADR 0027: the desktop application, on one OS; `build` proves the window links on all
  # three. `cargo audit` is here because this workflow runs when somebody is looking.
  desktop:
    # **`inputs` is empty for a tag push**, which is what the first arm is for: a release
    # runs every job whatever a dispatch might once have narrowed.
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'desktop' }}
    name: desktop
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/desktop/.nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Frontend — install, typecheck and build, test, lint
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
          npm test
          npm run lint

      # Every scene `npm run screenshots` takes still renders from its sample data — a command a
      # scene reaches with no fixture, or a screen that crashes on one, fails here rather than on the
      # day the images are needed. Nothing is written. See apps/desktop/demo/capture.mjs.
      - name: Frontend — demo scenes render
        working-directory: apps/desktop
        run: |
          npx playwright install --with-deps chromium
          npm run screenshots -- --check

      # The Tauri crates link against webkit2gtk, so even `cargo check` wants it present.
      - name: Install the libraries the window links against
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential

      # The root's rust-toolchain.toml is the nearest pin walking up from apps/desktop.
      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
          workspaces: "apps/desktop/src-tauri -> target"
          # See the note on `test`'s cache (T170a).
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Advisories against the window's dependency tree
        working-directory: apps/desktop/src-tauri
        run: cargo audit

  # T171: `window` and `binaries` build on runners of their own, and `build` packages what they
  # hand on. The three matrices must stay the same five rows.
  window:
    # **`inputs` is empty for a tag push**, which is what the first arm is for: a release
    # runs every job whatever a dispatch might once have narrowed. The `build` option covers all
    # three jobs.
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'build' }}
    name: window (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # One Tauri release build, twice over on macOS for the two slices (T103). Measured at 8 to 17
    # minutes cold in run 35458805745; there is no cache to make it warm (T170a).
    timeout-minutes: 45
    strategy:
      # An artifact that failed to build on one system is not a reason to stop producing the other
      # four — the same rule `test` and `bench` state one job up.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            container: ""
          # T85a: native, not cross. GitHub's own arm64-hosted runners exist and are free for this
          # (public) repository, so this leg is the same shape as the row above rather than a
          # cross-compilation of it — see the design's "Measured, not assumed".
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            container: ""
          - os: macos-latest
            target: ""
            container: ""
          # T85a, D2: the binaries in a manylinux_2_28 container for an older glibc. T103: the window on
          # the 22.04 host, because manylinux's WebKitGTK is too old for Tauri 2.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64:2026.09.02-0
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64:2026.09.02-0
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/leg-budget
        with:
          phase: start

      - uses: ./.github/actions/release-profile

      # On every leg, the Linux ones included: the window is built on the runner itself, never in
      # the container.
      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      # **No Actions cache (T170a).** This job's release artifacts, with `binaries`', are several GB,
      # and with them one `master` run writes more than the repository's 10 GB, so `master`'s own
      # entries would evict each other and every job would build cold.

      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/desktop/.nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install the libraries the window links against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential

      # T105: the window, through `packaging/desktop.sh` — which runs `npm ci`, `cargo tauri build`
      # (`--bundles app` on macOS, where a webview application is a `.app` directory), adds the
      # macOS slices itself, exports `MIXENGINE_RELEASE` and asserts what it produced.
      - name: Build the window
        shell: bash
        env:
          MIX_TARGET: ${{ matrix.target }}
        run: bash packaging/desktop.sh

      # T171c, E3: the window's half of `binaries`' x86_64 check, after the build above because
      # `tauri::generate_context!` reads the frontend it built at compile time.
      - name: Compile the window for x86_64 as well
        if: runner.os == 'macOS' && env.MIX_MACOS_SLICES == 'aarch64'
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          rustup target add x86_64-apple-darwin
          MIXENGINE_RELEASE=1 cargo check --release --locked --target x86_64-apple-darwin

      # **A tar, not the files** (T171, E1). `upload-artifact` keeps neither file modes nor
      # symlinks: the window would arrive not executable, and a macOS bundle does not survive the
      # trip without its links. The tar holds `window/<key>/…`, relative to `target/packaging`,
      # which is where `build` unpacks it and where `stage.sh` looks.
      - name: Hand the window on
        shell: bash
        run: tar -cf window.tar -C target/packaging window

      # Kept 14 days, like `desktop-<os>` before it: a window someone wants to try without the
      # installer is a reason to download one.
      - uses: actions/upload-artifact@v4
        with:
          name: window-${{ matrix.os }}
          path: window.tar
          if-no-files-found: error
          retention-days: 14

      - uses: ./.github/actions/leg-budget
        if: always()
        with:
          phase: end
          target-minutes: "15"
          ceiling-minutes: "45"

  binaries:
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'build' }}
    name: binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The four headless binaries, in release: twice on macOS for the two slices, and from scratch
    # inside a container on both Linux legs (T85a, D3), where no cache would reach anyway.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # `window`'s five rows; the comments are there.
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            container: ""
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            container: ""
          - os: macos-latest
            target: ""
            container: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64:2026.09.02-0
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64:2026.09.02-0
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/leg-budget
        with:
          phase: start

      - uses: ./.github/actions/release-profile

      # Only the legs that build on the runner itself rather than inside a container: the two Linux
      # legs install their own pinned toolchain inside `stage.sh --container`'s `docker run`, since
      # nothing installed here is visible from there.
      - name: Install pinned toolchain
        if: matrix.container == ''
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - name: Fetch dependencies
        if: matrix.container == ''
        run: cargo fetch --locked

      # `stage.sh --build-only` (T171a): the compile half of what the per-OS packaging scripts used
      # to do, with the same flags — `MIXENGINE_RELEASE`, `crt-static` on Windows, the container on
      # Linux — because it is the same file doing it.
      - name: Build the binaries
        shell: bash
        env:
          MIX_TARGET: ${{ matrix.target }}
          MIX_CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            source packaging/common.sh
            slices="$(mix_macos_slices)"
            for slice in $slices; do
              rustup target add "$slice-apple-darwin"
              bash packaging/stage.sh --build-only --target "$slice-apple-darwin"
            done
          else
            args=(--build-only --target "$MIX_TARGET")
            if [ -n "$MIX_CONTAINER" ]; then
              args+=(--container "$MIX_CONTAINER")
            fi
            bash packaging/stage.sh "${args[@]}"
          fi

      # **T171c, E3.** A branch that builds only `aarch64` would otherwise stop noticing code that
      # does not compile for Intel Macs until a tag. `check` over the same `-p` list `stage.sh`
      # builds, with `MIXENGINE_RELEASE` as it sets it: it proves the code compiles for x86_64 without
      # paying for a second release build. Linking that slice and `lipo` are left to `master`.
      - name: Compile for x86_64 as well
        if: runner.os == 'macOS' && env.MIX_MACOS_SLICES == 'aarch64'
        shell: bash
        run: |
          set -euo pipefail
          source packaging/common.sh
          rustup target add x86_64-apple-darwin
          packages=()
          for crate in "${MIX_CRATES[@]}"; do
            if [ "$crate" != "$MIX_WINDOW" ]; then
              packages+=(-p "$crate")
            fi
          done
          MIXENGINE_RELEASE=1 cargo check --release --locked --target x86_64-apple-darwin "${packages[@]}"

      # Whether this runner's toolchain makes a binary that runs, asked of the one just built.
      - name: Smoke test this leg's toolchain
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: '"target/${{ matrix.target }}/release/mix.exe" --version'

      # A tar for the reason `window` gives, of exactly the binaries `common.sh` names and nothing
      # else of cargo's: `build` fails on any trace of a compile in its tree, and `deps/` or
      # `.fingerprint/` arriving in this tar would be one.
      - name: Hand the binaries on
        shell: bash
        run: bash .github/scripts/binaries-hand-on.sh

      # One day: it exists to reach `build` in the same run, and nobody installs from it.
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: binaries.tar
          if-no-files-found: error
          retention-days: 1

      - uses: ./.github/actions/leg-budget
        if: always()
        with:
          phase: end
          target-minutes: "15"
          ceiling-minutes: "45"

  build:
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'build' }}
    name: build (${{ matrix.os }})
    # **The whole of both matrices, not this leg's row** — Actions has no per-leg `needs`, so every
    # leg here waits for the slowest `window` or `binaries` anywhere. Accepted in the T171 spec (E1):
    # the run ends with its slowest leg either way, and five matrix-free copies of this job would
    # cost more to keep than the minutes they save.
    needs: [window, binaries]
    runs-on: ${{ matrix.os }}
    # Packaging and the two probes, nothing compiled: about three to five minutes. The ceiling is
    # generous because the macOS probe installs a `.pkg` for real.
    timeout-minutes: 30
    # `actions: read` for "The whole path", which asks the jobs API when `window` and `binaries`
    # started.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      # `window`'s five rows; the comments are there.
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            container: ""
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            container: ""
          - os: macos-latest
            target: ""
            container: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64:2026.09.02-0
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64:2026.09.02-0
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/leg-budget
        with:
          phase: start

      - uses: ./.github/actions/release-profile

      # From this run only, which is `download-artifact`'s default and never overridden here: an
      # artifact belongs to the commit its run built.
      - uses: actions/download-artifact@v4
        with:
          name: window-${{ matrix.os }}

      - uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.os }}

      # Back where the two builds left them, so every packaging script below runs as it would after
      # compiling here — with `MIX_PREBUILT` telling `stage.sh` that it must not (T171a).
      - name: Put both where their builds left them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/packaging
          tar -xf window.tar -C target/packaging
          tar -xf binaries.tar
          rm window.tar binaries.tar
          echo "MIX_PREBUILT=1" >> "$GITHUB_ENV"

      # Neither is on the ubuntu image; appimagetool refuses to start without `desktop-file-utils`.
      - name: Install the packaging tools this runner is missing
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm desktop-file-utils

      # NSIS is not on the windows image; Chocolatey puts it where `packaging/windows/build.sh` looks.
      - name: Install the packaging tools this runner is missing
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress --yes

      - name: Windows artifacts
        if: runner.os == 'Windows'
        shell: bash
        env:
          MIX_TARGET: ${{ matrix.target }}
        run: bash packaging/windows/build.sh

      - name: macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/macos/build.sh

      # T86a: the Mark-of-the-Web and quarantine readings of this leg's artifacts; `windows-latest`
      # alone (D12). `MIX_PROBE_INSTALL` installs for real and puts the machine back.
      - name: What an unsigned release shows SmartScreen
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          MIX_TARGET: ${{ matrix.target }}
          MIX_PROBE_INSTALL: "1"
        run: bash packaging/windows/probe.sh

      - name: What an unsigned release shows Gatekeeper
        if: runner.os == 'macOS'
        shell: bash
        env:
          MIX_PROBE_INSTALL: "1"
        run: bash packaging/macos/probe.sh

      - name: Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        env:
          MIX_TARGET: ${{ matrix.target }}
          MIX_CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          bash packaging/linux/build-deb.sh
          bash packaging/linux/build-rpm.sh
          bash packaging/linux/build-appimage.sh
          bash packaging/linux/build-tarball.sh

      # For a person reading the log rather than for the gate: every script has already opened what
      # it made and refused if a binary was missing from it.
      - name: What this leg produced
        shell: bash
        run: ls -l target/packaging/dist

      - uses: actions/upload-artifact@v4
        with:
          name: mixengine-${{ matrix.os }}
          path: target/packaging/dist/*
          if-no-files-found: error
          retention-days: 14

      # **T171's tripwire.** The two tars carry finished binaries and nothing of cargo's, so a `deps`
      # or `.fingerprint` directory, or the window's own `target`, exists here only if something
      # compiled in this job. `stage.sh` refuses to under `MIX_PREBUILT`; this is for whatever else
      # might start to, since the result would be a green job exactly as slow as before T171.
      - name: Nothing was compiled here
        if: always()
        shell: bash
        run: |
          found="$(find target -maxdepth 4 \( -name deps -o -name .fingerprint \) 2>/dev/null || true)"
          if [ -d apps/desktop/src-tauri/target ]; then
            found="$found apps/desktop/src-tauri/target"
          fi
          if [ -n "${found// /}" ]; then
            echo "::error title=Compiled in build::cargo left $found; this job packages what window and binaries built and compiles nothing"
            exit 1
          fi

      # What a person waits for is the path, not this job: from the first of `window` and `binaries`
      # starting to here. Read from the jobs API so neither has to pass a timestamp along.
      - name: The whole path
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OS: ${{ matrix.os }}
        run: |
          first="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq \
            "[.jobs[] | select(.name == \"window ($OS)\" or .name == \"binaries ($OS)\") | .startedAt | fromdate] | min")"
          elapsed=$(( $(date +%s) - first ))
          printf 'build path (%s): %dm%02ds, target 18 minutes.\n' "$OS" $((elapsed / 60)) $((elapsed % 60)) >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt $((18 * 60)) ]; then
            echo "::notice title=Path over its target::window, binaries and build took $((elapsed / 60)) minutes against a target of 18."
          fi

      - uses: ./.github/actions/leg-budget
        if: always()
        with:
          phase: end
          target-minutes: "5"
          ceiling-minutes: "30"

  # T86. Three questions that need no compiler, so a release that cannot work fails in thirty seconds
  # instead of in an hour. It gates `release` and nothing else — a conditional `needs` is not a thing
  # Actions has, and making `build` wait behind this would slow every ordinary run for a job that has
  # nothing to say on one.
  preflight:
    name: preflight
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (inputs.jobs == '' || inputs.jobs == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: The tag, the version, the key and the secrets agree
        env:
          UPDATE_SECRET_KEY: ${{ secrets.UPDATE_SECRET_KEY }}
          UPDATE_PASSWORD: ${{ secrets.UPDATE_PASSWORD }}
        run: bash .github/scripts/preflight.sh

  # T86, D4: signing happens once, here. `needs` omits `system` and `bench`: a person reads them,
  # and they do not gate.
  release:
    name: release
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (inputs.jobs == '' || inputs.jobs == 'all') }}
    needs: [preflight, lint, test, bindings, desktop, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign

      # `mixengine-*` and nothing else. Since T171 a run also carries each leg's `window-<os>` and
      # `binaries-<os>`, which are what `build` was made from and not release files, and the gather
      # below would move them into `dist` along with the rest.
      - uses: actions/download-artifact@v4
        with:
          path: legs
          pattern: mixengine-*

      # Five uploads into one directory. `merge-multiple` would let a name that appears twice be one
      # artifact silently replacing another, and "silently" is the word that rules it out.
      - name: Gather what the five legs built
        run: |
          set -euo pipefail
          dist="target/packaging/dist"
          mkdir -p "$dist"
          for file in legs/*/*; do
            name="$(basename "$file")"
            if [ -e "$dist/$name" ]; then
              echo "two build legs produced $name" >&2
              exit 1
            fi
            mv "$file" "$dist/$name"
          done
          ls -l "$dist"

      # T56: the contract, packed from the committed tree, before signing so that it is signed.
      - name: Pack the published API contract
        run: bash packaging/bindings.sh --pack

      # T88. The feed lists the payload archives of every leg, and no build leg can see the other
      # four — so it is written here, and it is written *before* the step below, which is what puts
      # `latest.json.minisig` beside it under the name an installed MixEngine appends.
      - name: Write the update feed
        run: bash packaging/feed.sh --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

      - name: Sign every artifact
        env:
          MIX_SIGN_SECRET_KEY: ${{ secrets.UPDATE_SECRET_KEY }}
          MIX_SIGN_PASSWORD: ${{ secrets.UPDATE_PASSWORD }}
        run: bash packaging/sign.sh

      # A draft, which a person publishes. The unsigned-binary warning goes at the top of the notes.
      - name: Assemble the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            notes_header="$(printf '%s\n' \
              '### Installation notes' \
              '' \
              "Nothing is code-signed or notarised, by design: expect SmartScreen on Windows and Gatekeeper's" \
              '"Open Anyway" on macOS. A machine with Smart App Control enforcing is not supported. On ARM64' \
              'Windows some runtimes have no build of their own and run under emulation, marked `emulated` in' \
              '`mix runtime available`.')"
            gh release create "$GITHUB_REF_NAME" \
              --draft --title "$GITHUB_REF_NAME" --generate-notes \
              --notes "$notes_header"
          fi
          gh release upload "$GITHUB_REF_NAME" target/packaging/dist/* --clobber

      # T79a's D5, one repository along: *created* and *published* are different claims, and an
      # upload that clobbered the wrong asset is exactly what the second check catches.
      - name: Verify what was published, and not only what was signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-verify.sh

      - name: Where it is
        run: |
          echo "A draft release is waiting at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases" \
            "— review it and publish it by hand." >>"$GITHUB_STEP_SUMMARY"
