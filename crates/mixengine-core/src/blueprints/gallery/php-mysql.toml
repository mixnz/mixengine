schema = 1

[blueprint]
name = "PHP with MySQL"
description = "Plain PHP on PHP-FPM with MySQL - no framework; put your index.php in the project root"
created_at = "2026-09-13T00:00:00Z"

[blueprint.created_on]
os = "any"
version = "0.0.1"

[runtimes]
php = "8.4"

[site]
kind = "php-fpm"
doc_root = ""
https = true
domain_pattern = "{project}.test"

[[services]]
name = "mysql"
instance = "main"
database = "{project}"
user = "{project}"
