# Generated by MixEngine for the site at {{ primary }}. Every edit here is overwritten on the next
# render; what you change is the site itself, with `mix site update`.
#
{%- if certificate %}
# Certificate sha256:{{ certificate.fingerprint }}
#
# That line is not a note. It exists so that this file differs when the certificate differs, which is
# what makes the server reload: a certificate is reissued to the same path, so without it a renewed
# certificate renders byte-identical bytes, the installer finds no change, and the running server
# goes on serving the certificate it already holds. Delete it and a reissued certificate is never
# served.
#
{%- endif %}
# Every path below is forward-slashed and quoted, on both counts deliberately: nginx's own
# `ngx_conf_read_token` treats `\` inside a quoted string as an escape, so a home under
# `C:\Users\Nguyen Hai Quang` arrives with every separator eaten — and unquoted, the directive stops
# at the space instead.
{%- if activator %}
# The pool this site's project resolves to, and the activator that starts it again when it has been
# idle-stopped — roadmap task T70. Named after the *site* and never after the pool: two sites sharing
# one pool are ordinary, and nginx refuses a configuration that declares one upstream name twice,
# which takes the whole front end down rather than the one site.
upstream {{ group }} {
    server {{ upstream }};
    server {{ activator }} backup;
}

{% endif %}
{%- if https_redirect and certificate %}
# **Two blocks, on the T51 design's own precedent for Caddy (D2), arrived at for nginx's own
# reason** — roadmap task T98. One `server` could carry both listeners, as T51's D6 found — but it
# cannot also carry a redirect: a `location` is matched after nginx has already picked a block by
# `listen` address, so "serve on this listener, redirect on that one" inside one block would need an
# `if` testing which listener accepted the connection, and nginx's own wiki ("If is Evil") warns that
# `if` in this context is rewritten into the module's request-processing phases rather than behaving
# like an ordinary conditional. Two blocks is the shape that avoids it.
server {
    # **The port the process binds, which is not always the port a browser asks for** — T43, D8.
    listen {{ listen }};
{%- if lan %}

    # **A second listener, for this one site, because sharing is opt-in per site** — roadmap task
    # T74. Loopback stays above it rather than being replaced.
    listen {{ lan }};
{%- endif %}

    # **The mDNS name joins the names this site answers to** — roadmap task T75.
    server_name {{ domains | join(' ') }}{% if mdns %} {{ mdns }}{% endif %};
{%- if authority %}

    # **Answered here and nowhere behind the redirect** — roadmap task T75 for the route, T98 for
    # why it is exempted. A phone has not yet trusted this home's authority, so it can only reach
    # this document before that trust exists — a redirect that caught this request as well would
    # send the phone into a handshake TLS refuses, for the one file that would have fixed that.
    location = /__mixengine/ca.crt {
        alias "{{ authority }}/ca.crt";
        default_type application/x-x509-ca-cert;
    }
{%- endif %}

    # **Everything else goes straight to HTTPS.** `$host` is the request's own, not this site's
    # `domains` list, so an alias and the LAN address each redirect to the scheme on the name they
    # were reached by rather than to `$server_name`, the block's first name.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Signed by this home's own authority — roadmap task T50.
    listen {{ listen_tls }} ssl;
{%- if lan_tls %}

    # The LAN address over TLS as well — the certificate carries it as an IP SAN (T74, D9).
    listen {{ lan_tls }} ssl;
{%- endif %}

    server_name {{ domains | join(' ') }}{% if mdns %} {{ mdns }}{% endif %};
    ssl_certificate "{{ certificate.certificate }}";
    ssl_certificate_key "{{ certificate.key }}";

    # No `ssl_protocols`, no cipher list, no HSTS: nginx's own defaults are current, and a
    # hand-written cipher list is a thing that rots in a repository until it is the reason a browser
    # refuses a site.

    root "{{ doc_root }}";
    index index.php index.html index.htm;
{%- if kind == "php-fpm" %}

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include "{{ fastcgi_params }}";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
{%- if activator %}
        fastcgi_pass {{ group }};
        fastcgi_next_upstream error timeout;
{%- else %}
        fastcgi_pass {{ upstream }};
{%- endif %}
    }
{%- elif kind == "static" %}

    location / {
        try_files $uri $uri/ =404;
    }
{%- else %}

    location / {
        proxy_pass {{ upstream }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
{%- endif %}
}
{%- else %}
server {
    # **The port the process binds, which is not always the port a browser asks for** — T43, D8.
    # nginx has no global listen the way Caddy has `http_port`, so this is where the mapping lands:
    # a front end answering on 80 listens on 8080 on macOS and on 80 on the other two, and nothing
    # above `mixengine-platform` knows which system this is.
    listen {{ listen }};
{%- if lan %}

    # **A second listener, for this one site, because sharing is opt-in per site** — roadmap task
    # T74. Loopback stays above it rather than being replaced: the phone and the developer's own
    # browser are looking at the same site at the same time.
    #
    # nginx groups servers by listen address before it consults `server_name`, so this address has
    # exactly one server block in its group and a LAN request carrying another site's name is
    # answered by this site as that group's default. That is the intended outcome — no unshared site
    # is served over the LAN — and `nginx.rs` asserts it so a later change cannot turn it into the
    # other one.
    listen {{ lan }};
{%- endif %}
{%- if certificate %}

    # Signed by this home's own authority — roadmap task T50. **`ssl` on the listen line and not on
    # the block**, which is why this stays one `server` where Caddy needs two: nginx attaches TLS to
    # a listener, Caddy to a site block. Measured rather than assumed — nginx 1.24 answers
    # `syntax is ok` to exactly this shape.
    listen {{ listen_tls }} ssl;
{%- if lan_tls %}

    # The LAN address over TLS as well — the certificate carries it as an IP SAN (T74, D9), so a
    # browser that reaches this listener by address is offered a certificate that covers it.
    listen {{ lan_tls }} ssl;
{%- endif %}
    ssl_certificate "{{ certificate.certificate }}";
    ssl_certificate_key "{{ certificate.key }}";

    # No `ssl_protocols`, no cipher list, no HSTS: nginx's own defaults are current, and a
    # hand-written cipher list is a thing that rots in a repository until it is the reason a browser
    # refuses a site.
{%- endif %}
    # **The mDNS name joins the names this site answers to** — roadmap task T75. nginx picks a
    # listener group by address and only then consults `server_name`, so this is the half that
    # decides which site replies to `<slug>-mixengine.local`; the daemon's responder only decides
    # where the name resolves.
    server_name {{ domains | join(' ') }}{% if mdns %} {{ mdns }}{% endif %};

    root "{{ doc_root }}";
    index index.php index.html index.htm;
{%- if authority %}

    # **This home's certificate authority, for a phone that has to install it** - roadmap task T75.
    # `location =` and `alias` name one exact file, and the file named is the rendered copy: never
    # `certs/ca/`, which holds the signing key beside the certificate.
    #
    # The content type is what makes iOS offer a profile and Android recognise the file; without it
    # the download is a text file nothing knows what to do with.
    location = /__mixengine/ca.crt {
        alias "{{ authority }}/ca.crt";
        default_type application/x-x509-ca-cert;
    }
{%- endif %}
{%- if kind == "php-fpm" %}

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # **The archive's own copy**, by the absolute path the index publishes it at — D6. A
        # generated configuration has no `conf/` beside it, and writing the seventeen lines in here
        # by hand would be MixEngine maintaining a second copy of a file the package already ships
        # and the server already reads.
        include "{{ fastcgi_params }}";

        # After the include and not before it: the packaged `fastcgi_params` sets `SCRIPT_FILENAME`
        # in some builds and not others, and the last assignment wins.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
{%- if activator %}
        fastcgi_pass {{ group }};

        # **The whole of what Caddy needs three directives for** — roadmap task T70. `backup` in an
        # upstream group already means *only once the others have refused*, so there is no load
        # balancing to switch off and no policy to state. `error` is the case this exists for: the
        # pool is idle-stopped, the connection is refused, and the request moves to the activator
        # rather than becoming a 502. Measured against nginx 1.24.0 with the pool's address dead:
        # 200 on the first request, in 7.9 ms.
        fastcgi_next_upstream error timeout;
{%- else %}
        fastcgi_pass {{ upstream }};
{%- endif %}
    }
{%- elif kind == "static" %}

    location / {
        try_files $uri $uri/ =404;
    }
{%- else %}

    location / {
        proxy_pass {{ upstream }};
        proxy_http_version 1.1;

        # What the application on the other end needs to build its own URLs with. Without `Host` it
        # sees the loopback address it is listening on rather than the name somebody typed.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A dev server's hot reload is a websocket, and without these two it is an HTTP request
        # answered 400 and a page that never updates.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
{%- endif %}
}
{%- endif %}
