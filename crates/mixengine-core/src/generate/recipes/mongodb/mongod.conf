# Generated by MixEngine for {{ service.id }} from {{ package.name }} {{ package.version }}.
# Every edit here is overwritten on the next start. What you change is an override on the service.

# **Loopback, and the recipe refuses anything else.** This server runs with access control off, so
# an address a network can reach is a database anybody on that network can read and delete.
net:
  bindIp: {{ service.bind }}
  port: {{ service.port }}

# **Single quotes, with a quote doubled.** YAML's single-quoted scalar has exactly that one escape,
# so a Windows path arrives with its backslashes as written; a double-quoted one would read `\U` as
# the start of an escape and refuse the file.
#
# The cache is a whole number of megabytes turned into WiredTiger's gigabytes. Left alone WiredTiger
# takes half of the machine's memory less one gigabyte, which on a sixteen-gigabyte laptop reserves
# seven and a half for a development database; 0.25 is the smallest `mongod` accepts.
storage:
  dbPath: '{{ paths.data | replace("'", "''") }}'
  wiredTiger:
    engineConfig:
      cacheSizeGB: {{ settings.wiredtiger_cache_mb / 1024 }}

# Full-time diagnostic data capture keeps up to 200 MB of samples in the data directory for
# MongoDB's support engineers, which a development home does not have.
setParameter:
  diagnosticDataCollectionEnabled: false

# No `systemLog`: with no destination `mongod` logs to standard output, which is the stream
# `mix service logs` reads. No `processManagement.fork` either: its default is to stay in the
# foreground, where the supervisor can see it.

{{ extra }}
