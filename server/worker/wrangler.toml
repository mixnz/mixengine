name = "mixlab-sync"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# **A deploy keeps the variables set on the dashboard.** Without `keep_vars`, every
# `wrangler deploy` — a Workers Build on push included — deletes the plain-text variables set under
# Settings → Variables and Secrets, and a server that worked yesterday answers `503` naming
# EMAIL_PROVIDER. Secrets survive a deploy either way. A name listed in `[vars]` below still wins
# over the dashboard on every deploy.
keep_vars = true

# One Durable Object per account (D8). The class is bound once; which object a request reaches is
# `idFromName(hex(SHA-256(lowercased address)))`, which is what this design has instead of an index.
[[durable_objects.bindings]]
name = "ACCOUNT"
class_name = "Account"

# **`new_sqlite_classes`, not `new_classes`.** Durable Objects are reachable on the free plan only
# with the SQLite storage backend, and that backend is also what makes the record table of D3 one
# file per account rather than rows in a shared one. Getting this wrong fails at deploy time on a
# free account, not locally.
# Registration and asking for a reset are counted per source rather than per account: they are
# abused by opening many accounts, which a counter inside one account's object cannot see.
[[durable_objects.bindings]]
name = "SOURCE_LIMIT"
class_name = "SourceLimit"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Account", "SourceLimit"]

# Every number here is reported by `/v1/capabilities` and is configuration rather than protocol: a
# server may report any value, and a client reads rather than assumes (D4a, D9).
[vars]
MAX_RECORD_BYTES = "1048576"
MAX_BATCH_OPERATIONS = "100"
MAX_BATCH_BYTES = "8388608"
MAX_PAGE_RECORDS = "500"
ACCOUNT_QUOTA_BYTES = "20971520"
TOMBSTONE_RETENTION_DAYS = "90"
# EMAIL_FROM and EMAIL_PROVIDER are required and neither is named here: they belong to one
# deployment, not to this project. A placeholder address here would win over the dashboard on every
# deploy and turn a `503` naming what is missing into a first letter the provider refuses. Set them
# under Settings → Variables and Secrets; EMAIL_PROVIDER is one of brevo, mailgun, mailtrap,
# postmark, resend or sendgrid.

# PEPPER and EMAIL_API_KEY are secrets and are never written here:
#   wrangler secret put PEPPER
#   wrangler secret put EMAIL_API_KEY
# A deployment without them refuses every request and names what is missing.

# What CI runs the conformance suite against. It sends no mail, serves `/__test__/outbox` instead,
# and reports small limits so the quota and pagination tests are reachable in seconds rather than
# minutes. Never deploy this environment.
[env.conformance]
[env.conformance.vars]
TEST_OUTBOX = "1"
MAX_RECORD_BYTES = "65536"
MAX_BATCH_OPERATIONS = "25"
MAX_BATCH_BYTES = "1048576"
MAX_PAGE_RECORDS = "10"
ACCOUNT_QUOTA_BYTES = "1048576"
TOMBSTONE_RETENTION_DAYS = "90"

# High enough that the suite never trips it: it asserts the shape of a refusal and never trips one
# deliberately (D4a), and one runner opening fifty accounts is what the suite does on purpose.
REGISTRATIONS_PER_HOUR = "100000"
RESETS_PER_HOUR = "100000"
AUTH_PER_HOUR = "100000"

[[env.conformance.durable_objects.bindings]]
name = "ACCOUNT"
class_name = "Account"

[[env.conformance.durable_objects.bindings]]
name = "SOURCE_LIMIT"
class_name = "SourceLimit"

[[env.conformance.migrations]]
tag = "v1"
new_sqlite_classes = ["Account", "SourceLimit"]

# The same server with tombstones reaped at once, so `410 cursor-expired` is reachable. Ninety days
# is not something a test can wait out, and a suite that skipped that path would leave the two
# implementations free to disagree about it.
[env.reaper]
[env.reaper.vars]
TEST_OUTBOX = "1"
MAX_RECORD_BYTES = "65536"
MAX_BATCH_OPERATIONS = "25"
MAX_BATCH_BYTES = "1048576"
MAX_PAGE_RECORDS = "10"
ACCOUNT_QUOTA_BYTES = "1048576"
TOMBSTONE_RETENTION_DAYS = "0"
REGISTRATIONS_PER_HOUR = "100000"
RESETS_PER_HOUR = "100000"
AUTH_PER_HOUR = "100000"
# A date this instance announces it will close on, so a client can be checked against a server
# that names one (D4a). Advisory: nothing here refuses a request after it.
CLOSING_ON = "2027-03-01"
# And closed with a shared token, the way a company running this for itself would (D4a).
ACCESS_TOKEN = "conformance-shared-token"

[[env.reaper.durable_objects.bindings]]
name = "ACCOUNT"
class_name = "Account"

[[env.reaper.durable_objects.bindings]]
name = "SOURCE_LIMIT"
class_name = "SourceLimit"

[[env.reaper.migrations]]
tag = "v1"
new_sqlite_classes = ["Account", "SourceLimit"]
