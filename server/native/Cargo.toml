[package]
name = "mixlab-sync"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mixnz/mixlab"
publish = false
description = "MixLab's sync server over a SQLite file — the implementation somebody runs themselves."

# A workspace of its own, and excluded from the root one (ADR 0046, decision 2) for the reason
# `apps/desktop/src-tauri` is: an HTTP server's tree would defeat `deny.toml`'s duplicate-version
# ban and the elevated helper's dependency budget in one move.
[workspace]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite itself, so a container does not have to carry a matching system copy
# and a person building this on a laptop needs no development headers.
rusqlite = { version = "0.32", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.9"
hex = "0.4"
base64 = "0.22"
subtle = "2.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# SMTP, which is the one thing the Worker cannot do and the thing most people self-hosting
# already have. rustls rather than native-tls so the container carries no OpenSSL.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1-rustls-tls",
    "builder",
    "hostname",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
